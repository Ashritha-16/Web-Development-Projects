<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ashritha's Web Development Projects</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a, #1e293b, #0b1220);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 20px;
}

h1 {
  font-size: 3rem;
  text-align: center;
  margin-bottom: 10px;
}

p {
  color: #cbd5e1;
  font-size: 1.1rem;
  text-align: center;
  margin-bottom: 40px;
  max-width: 650px;
}

.container {
  width: 100%;
  max-width: 1100px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  display: block;
  text-decoration: none;
  color: white;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  padding: 25px;
  font-size: 18px;
  transition: 0.3s ease;
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-8px);
  border-color: cyan;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 100%;
  height: 100%;
  background: rgba(0,255,255,0.08);
  transition: 0.4s;
}

.card:hover::before {
  left: 0;
}

.card span {
  position: relative;
  z-index: 1;
  font-weight: 500;
}

footer {
  margin-top: 60px;
  color: #94a3b8;
  font-size: 0.95rem;
  text-align: center;
}

@media (max-width: 600px) {
  h1 { font-size: 2.2rem; }
  p { font-size: 1rem; }
}
</style>

</head>

<body>

<h1>🚀 Ashritha's Web Development Projects</h1>

<p>
A collection of frontend projects built using HTML, CSS, and JavaScript.
Click any project to explore.
</p>

<div class="container">

  <a class="card" href="./Stopwatch-Web-App/">
    <span>⏱️ Stopwatch Web App</span>
  </a>

  <a class="card" href="./Task-Manager_Web_App/">
    <span>📝 Task Manager App</span>
  </a>

  <a class="card" href="./Tic-Tac-Toe_Web_App/">
    <span>🎮 Tic Tac Toe Game</span>
  </a>

  <a class="card" href="./weather-web-app/">
    <span>🌦️ Weather Web App</span>
  </a>

  <a class="card" href="./YouTube-Clone/">
    <span>▶ YouTube Clone</span>
  </a>

</div>

<footer>
  © 2026 Ashritha | Built with ❤️ using HTML, CSS & JavaScript
</footer>

</body>
</html>
