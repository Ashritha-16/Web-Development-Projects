<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects</title>

<style>
/* =========================
   BASIC RESET
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* =========================
   PAGE BACKGROUND
========================= */
body {
  background-color: #f5f7fb;
  color: #333;
  text-align: center;
  padding: 30px;
}

/* =========================
   HEADER
========================= */
h1 {
  margin-bottom: 10px;
}

p {
  margin-bottom: 30px;
  color: #666;
}

/* =========================
   PROJECT CONTAINER
========================= */
.container {
  max-width: 900px;
  margin: auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

/* =========================
   PROJECT BOX
========================= */
.box {
  width: 200px;
  background: white;
  padding: 20px;
  border: 1px solid #ddd;
  border-radius: 8px;
  text-decoration: none;
  color: #333;
}

/* hover effect */
.box:hover {
  border-color: #007bff;
}

/* =========================
   FOOTER
========================= */
footer {
  margin-top: 40px;
  font-size: 14px;
  color: #777;
}
</style>

</head>

<body>

<h1>My Web Development Projects</h1>
<p>Simple project showcase</p>

<div class="container">

  <a class="box" href="#">Calculator</a>
  <a class="box" href="#">Todo App</a>
  <a class="box" href="#">Stopwatch</a>
  <a class="box" href="#">Login Page</a>
  <a class="box" href="#">Weather App</a>
  <a class="box" href="#">Portfolio</a>

</div>

<footer>
  © 2026 My Projects
</footer>

</body>
</html>
