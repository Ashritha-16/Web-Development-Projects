<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects</title>

<style>
/* =========================
   GLOBAL STYLES
========================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", Arial, sans-serif;
}

/* =========================
   BODY
========================= */
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 60px 30px;
  background: linear-gradient(135deg, #0f172a, #1e293b, #0b1220);
  color: #fff;
}

/* =========================
   HEADER
========================= */
h1 {
  font-size: 3rem;
  margin-bottom: 8px;
  text-align: center;
}

p {
  color: #cbd5e1;
  margin-bottom: 50px;
  font-size: 18px;
}

/* =========================
   GRID CONTAINER
========================= */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  width: 100%;
  max-width: 1200px;
}

/* =========================
   PROJECT CARD
========================= */
.box {
  position: relative;
  padding: 40px;
  border-radius: 18px;
  text-decoration: none;
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  transition: 0.3s ease;
  overflow: hidden;
  font-weight: 500;
  font-size: 18px;
}

/* hover */
.box:hover {
  transform: translateY(-10px);
  border-color: rgba(0, 255, 255, 0.5);
  box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

/* subtle highlight */
.box::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(0, 255, 255, 0.08);
  transition: 0.4s;
}

.box:hover::before {
  left: 0;
}

/* text inside card */
.box span {
  position: relative;
  z-index: 1;
  font-size: 1.2rem;
}

/* =========================
   FOOTER
========================= */
footer {
  margin-top: 70px;
  font-size: 16px;
  color: #94a3b8;
}

/* =========================
   RESPONSIVE
========================= */
@media (max-width: 600px) {
  h1 {
    font-size: 2.2rem;
  }

  .box {
    padding: 25px;
    font-size: 16px;
  }
}
</style>

</head>

<body>

</html>
